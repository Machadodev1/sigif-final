<form class="row g-2 align-items-end mb-4" method="get">
  <div class="col-md-3"><label class="form-label">Período</label><select class="form-select" name="periodo" onchange="this.form.submit()"><option value="hoy" {% if periodo == 'hoy' %}selected{% endif %}>Hoy</option><option value="semana" {% if periodo == 'semana' %}selected{% endif %}>Esta semana</option><option value="mes" {% if periodo == 'mes' %}selected{% endif %}>Este mes</option><option value="ano" {% if periodo == 'ano' %}selected{% endif %}>Este año</option><option value="personalizado" {% if periodo == 'personalizado' %}selected{% endif %}>Rango personalizado</option></select></div>
  <div class="col-md-3"><label class="form-label">Desde</label><input class="form-control" type="date" name="desde" value="{{ inicio|date:'Y-m-d' }}"></div><div class="col-md-3"><label class="form-label">Hasta</label><input class="form-control" type="date" name="hasta" value="{{ fin|date:'Y-m-d' }}"></div><div class="col-md-2"><button class="btn btn-primary w-100">Aplicar</button></div>
</form>
