<div class="card border-0 shadow-sm p-3 mb-4 rounded-3 bg-white">
  <form class="row g-2 align-items-end" method="get">
    <div class="col-md-3 col-sm-6">
      <label class="form-label small fw-semibold text-muted mb-1">
        <i class="bi bi-calendar3 me-1 text-primary"></i> Período
      </label>
      <select class="form-select form-select-sm shadow-none rounded-2" name="periodo" onchange="this.form.submit()">
        <option value="hoy" {% if periodo == 'hoy' %}selected{% endif %}>Hoy</option>
        <option value="semana" {% if periodo == 'semana' %}selected{% endif %}>Esta semana</option>
        <option value="mes" {% if periodo == 'mes' %}selected{% endif %}>Este mes</option>
        <option value="ano" {% if periodo == 'ano' %}selected{% endif %}>Este año</option>
        <option value="personalizado" {% if periodo == 'personalizado' %}selected{% endif %}>Rango personalizado</option>
      </select>
    </div>
    <div class="col-md-3 col-sm-6">
      <label class="form-label small fw-semibold text-muted mb-1">
        <i class="bi bi-calendar-event me-1"></i> Desde
      </label>
      <input class="form-control form-control-sm shadow-none rounded-2" type="date" name="desde" value="{{ inicio|date:'Y-m-d' }}">
    </div>
    <div class="col-md-3 col-sm-6">
      <label class="form-label small fw-semibold text-muted mb-1">
        <i class="bi bi-calendar-check me-1"></i> Hasta
      </label>
      <input class="form-control form-control-sm shadow-none rounded-2" type="date" name="hasta" value="{{ fin|date:'Y-m-d' }}">
    </div>
    <div class="col-md-3 col-sm-6 d-flex gap-2">
      <button type="submit" class="btn btn-sm btn-primary w-100 rounded-2 fw-medium shadow-sm d-flex align-items-center justify-content-center gap-1">
        <i class="bi bi-funnel-fill"></i> Aplicar filtro
      </button>
      <a href="{% url 'finanzas:finanzas_dashboard' %}" class="btn btn-sm btn-light border rounded-2 text-muted" title="Limpiar filtro">
        <i class="bi bi-arrow-counterclockwise"></i>
      </a>
    </div>
  </form>
</div>
