{% extends 'base.html' %}
{%load humanize %}
{% block content %}
<div class="container mt-4 mb-5">
    <h2 class="mb-4">Confirmar venta</h2>
    <div class="row">
        <div class="col-md-7">
            <div class="card p-4">
                <h4 class="mb-3">Datos del cliente</h4>
                <p class="text-muted">
                    Los datos del cliente son opcionales.
                </p>
                <div class="mb-3">
                    <label class="form-label">Cliente existente</label>
                    <select id="clienteSelect" class="form-control">
                        <option value="">-- Nuevo cliente / Consumidor final --</option>
                        {% for cliente in clientes %}
                        <option value="{{ cliente.id }}">{{ cliente.nombre }} - {{ cliente.correo }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div id="clienteForm">
                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" id="nombre" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Documento</label>
                    <input type="text" id="documento" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Correo</label>
                    <input type="email" id="correo" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Teléfono</label>
                    <input type="text" id="telefono" class="form-control">
                </div>
                </div>
            </div>
        </div>
        <div class="col-md-5">
            <div class="card p-4">
                <h4 class="mb-3">Resumen de compra</h4>
                <div id="productosFactura"></div>
                <hr>
                <div class="d-flex justify-content-between">
                    <span>Subtotal:</span>
                    <strong id="subtotal"></strong>
                </div>

                <div class="d-flex justify-content-between mt-2">
                    <span id="textoDescuento">Descuento:</span>
                    <strong id="descuentoFactura"></strong>
                </div>

                <hr>

                <div class="d-flex justify-content-between">
                    <h4>Total:</h4>
                    <h4 id="totalFactura"></h4>
                </div>

                <button
                    type="button"
                    id="btnConfirmar"
                    class="btn btn-success w-100 mt-3">
                    Confirmar venta
                </button>

                <a
                    href="/inventario/"
                    class="btn btn-secondary w-100 mt-2">
                    Volver al carrito
                </a>

            </div>

        </div>

    </div>

</div>

<script>

let carrito =
    JSON.parse(localStorage.getItem("carrito")) || [];

let porcentajeAplicado =
    parseFloat(
        localStorage.getItem("porcentajeAplicado")
    ) || 0;

const productosFactura =
    document.getElementById("productosFactura");

let subtotal = 0;

if(carrito.length === 0){

    productosFactura.innerHTML = `
        <p class="text-muted">
            No hay productos en el carrito.
        </p>
    `;

    document.getElementById("btnConfirmar").disabled = true;

}else{

    carrito.forEach(producto => {

        const subtotalProducto =
            producto.price * producto.cantidad;

        subtotal += subtotalProducto;

        productosFactura.innerHTML += `
            <div class="d-flex justify-content-between mb-3">

                <div>
                    <strong>
                        ${producto.title}
                    </strong>

                    <br>

                    <small class="text-muted">
                        ${producto.cantidad} x
                        $${producto.price.toFixed(2)}
                    </small>
                </div>

                <strong>
                    $${subtotalProducto.toFixed(2)}
                </strong>

            </div>
        `;
    });
}

const valorDescuento =
    subtotal * (porcentajeAplicado / 100);

const total =
    subtotal - valorDescuento;

document.getElementById("subtotal").innerText =
    "$" + subtotal.toFixed(2);

document.getElementById("descuentoFactura").innerText =
    "-$" + valorDescuento.toFixed(2);

document.getElementById("totalFactura").innerText =
    "$" + total.toFixed(2);


document.getElementById("btnConfirmar")
.addEventListener("click", () => {

    if(carrito.length === 0){

        alert("El carrito está vacío");

        return;
    }

    const datos = {

        cliente_id: clienteSelect ? clienteSelect.value : null,

        nombre: document.getElementById("nombre").value,

        documento: document.getElementById("documento").value,

        correo: document.getElementById("correo").value,

        telefono: document.getElementById("telefono").value,

        productos: carrito,

        descuento: porcentajeAplicado
    };


    fetch("/facturacion/confirmar-venta/", {
    method: "POST",
    credentials: "same-origin",
    headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": getCookie("csrftoken")
    },
    body: JSON.stringify(datos)
})

    .then(response => response.json())

    .then(data => {

        if(data.success){

    localStorage.removeItem("carrito");
    localStorage.removeItem("porcentajeAplicado");

    window.location.href = "/inventario/";

}else{

    alert(data.message);

}

    })

    .catch(error => {

        console.error(error);

        alert("Error al confirmar la venta");

    });

});


function getCookie(name){

    let cookieValue = null;

    if(document.cookie && document.cookie !== ''){

        const cookies =
            document.cookie.split(';');

        for(let cookie of cookies){

            cookie = cookie.trim();

            if(cookie.startsWith(name + '=')){

                cookieValue =
                    decodeURIComponent(
                        cookie.substring(
                            name.length + 1
                        )
                    );

                break;
            }
        }
    }

    return cookieValue;
}

// Mostrar/ocultar formulario de registro de cliente según selección
const clienteSelect = document.getElementById("clienteSelect");
const clienteForm = document.getElementById("clienteForm");

function toggleClienteForm(){
    if(!clienteForm || !clienteSelect) return;

    // Si hay un cliente seleccionado (valor no vacío) ocultar el formulario
    if(clienteSelect.value){
        clienteForm.style.display = "none";
    }else{
        clienteForm.style.display = ""; // volver a mostrar
    }
}

// Estado inicial
toggleClienteForm();

// Escuchar cambios en el select
clienteSelect && clienteSelect.addEventListener("change", toggleClienteForm);

</script>

{% endblock %}
