<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 – Página No Encontrada | SIGIF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --sidebar-bg:#222938; --sidebar-active-bg:#3a56e4;
      --bg-main:#f5f6fa; --text-dark:#2d3748; --text-muted:#64748b;
      --font-family:'Inter',system-ui,sans-serif;
      --error-color:#8b5cf6; --error-glow:rgba(139,92,246,0.18);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:var(--font-family); background:var(--bg-main); min-height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .bg-shapes { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
    .bg-shapes span { position:absolute; border-radius:50%; opacity:0.07; animation:floatShape 8s ease-in-out infinite; }
    .bg-shapes span:nth-child(1) { width:600px; height:600px; background:var(--error-color); top:-180px; left:-150px; animation-delay:0s; }
    .bg-shapes span:nth-child(2) { width:380px; height:380px; background:var(--sidebar-active-bg); bottom:-100px; right:-80px; animation-delay:2s; }
    .bg-shapes span:nth-child(3) { width:220px; height:220px; background:var(--error-color); bottom:30%; right:15%; animation-delay:4s; }
    @keyframes floatShape { 0%,100%{transform:translateY(0) scale(1);} 50%{transform:translateY(-30px) scale(1.04);} }
    .error-card { position:relative; z-index:1; background:#fff; border-radius:24px; box-shadow:0 20px 60px rgba(0,0,0,0.10),0 2px 8px rgba(0,0,0,0.06); padding:56px 64px; max-width:560px; width:90%; text-align:center; animation:slideUp 0.6s cubic-bezier(.22,1,.36,1) both; }
    @keyframes slideUp { from{opacity:0;transform:translateY(40px);} to{opacity:1;transform:translateY(0);} }
    .error-code { font-size:7rem; font-weight:800; line-height:1; background:linear-gradient(135deg,#8b5cf6,#a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; letter-spacing:-4px; margin-bottom:8px; }
    .error-icon { width:72px; height:72px; background:linear-gradient(135deg,#8b5cf6,#a78bfa); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 24px; box-shadow:0 8px 32px var(--error-glow); animation:pulse 2.5s ease-in-out infinite; }
    .error-icon i { font-size:2rem; color:#fff; }
    @keyframes pulse { 0%,100%{box-shadow:0 8px 32px var(--error-glow);} 50%{box-shadow:0 8px 48px rgba(139,92,246,0.38);} }
    .error-title { font-size:1.5rem; font-weight:700; color:var(--text-dark); margin-bottom:12px; }
    .error-description { font-size:0.95rem; color:var(--text-muted); line-height:1.7; margin-bottom:36px; }
    .error-badge { display:inline-flex; align-items:center; gap:6px; background:rgba(139,92,246,0.1); color:#6d28d9; font-size:0.78rem; font-weight:600; padding:4px 14px; border-radius:999px; margin-bottom:28px; border:1px solid rgba(139,92,246,0.25); letter-spacing:0.04em; text-transform:uppercase; }
    /* URL display */
    .error-url { display:inline-flex; align-items:center; gap:8px; background:#f8f9fc; border:1px solid #e2e8f0; border-radius:10px; padding:8px 18px; font-size:0.82rem; color:var(--text-muted); font-family:monospace; margin-bottom:28px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .error-actions { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    .btn-primary-error { display:inline-flex; align-items:center; gap:8px; background:linear-gradient(135deg,#3a56e4,#5b75f7); color:#fff; border:none; border-radius:12px; padding:12px 28px; font-size:0.92rem; font-weight:600; text-decoration:none; transition:transform 0.2s,box-shadow 0.2s; box-shadow:0 4px 16px rgba(58,86,228,0.25); }
    .btn-primary-error:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(58,86,228,0.35); color:#fff; }
    .btn-secondary-error { display:inline-flex; align-items:center; gap:8px; background:#f1f5f9; color:var(--text-dark); border:none; border-radius:12px; padding:12px 28px; font-size:0.92rem; font-weight:600; text-decoration:none; transition:background 0.2s,transform 0.2s; }
    .btn-secondary-error:hover { background:#e2e8f0; transform:translateY(-2px); color:var(--text-dark); }
    .error-brand { position:fixed; top:24px; left:36px; z-index:10; text-decoration:none; display:flex; align-items:center; }
    .brand-logo { height:52px; width:auto; filter:drop-shadow(0 2px 8px rgba(0,0,0,0.13)); transition:transform 0.2s; }
    .brand-logo:hover { transform:scale(1.04); }
    /* Orbit animation */
    .orbit-container { position:relative; width:72px; height:72px; margin:0 auto 24px; }
    .orbit-ring { position:absolute; inset:-14px; border-radius:50%; border:2px dashed rgba(139,92,246,0.3); animation:spin 8s linear infinite; }
    .orbit-dot { position:absolute; top:-5px; left:50%; transform:translateX(-50%); width:10px; height:10px; background:#8b5cf6; border-radius:50%; }
    @keyframes spin { to{transform:rotate(360deg);} }
  </style>
</head>
<body>
  {% load static %}
  <a href="/inicio/" class="error-brand">
    <img src="{% static 'img/logologin.png' %}" alt="SIGIF" class="brand-logo">
  </a>
  <div class="bg-shapes"><span></span><span></span><span></span></div>
  <div class="error-card">
    <div class="orbit-container">
      <div class="error-icon" style="margin:0;"><i class="bi bi-search"></i></div>
      <div class="orbit-ring"><div class="orbit-dot"></div></div>
    </div>
    <div class="error-code">404</div>
    <span class="error-badge"><i class="bi bi-map"></i> Not Found</span>
    <h1 class="error-title">Página No Encontrada</h1>
    <p class="error-description">La página que estás buscando no existe, fue movida o la URL fue escrita incorrectamente. Verifica la dirección o regresa al inicio.</p>
    <div class="error-url" id="currentUrl"><i class="bi bi-link-45deg"></i> <span></span></div>
    <div class="error-actions">
      <a href="javascript:history.back()" class="btn-secondary-error"><i class="bi bi-arrow-left"></i> Volver atrás</a>
      <a href="/inicio/" class="btn-primary-error"><i class="bi bi-house-fill"></i> Ir al inicio</a>
    </div>
  </div>
  <script>
    document.querySelector('#currentUrl span').textContent = window.location.pathname;
  </script>
</body>
</html>
