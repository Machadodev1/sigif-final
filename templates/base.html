{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>SIGIF</title>
  <link rel="stylesheet" href="{% static 'css/style1.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

  <aside class="sidebar">
    <div class="logo">
      <img src="{% static 'img/logo123.png' %}" alt="">
    </div>
    <div class="user-Info">
      <h3>Administrativo</h3>
      <p>Oficina central</p>
    </div>
    <nav class="menu">
      <ul>
        <li><a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">Dashboard</a></li>
        <li><a href="{% url 'usuarios' %}" class="{% if request.resolver_match.url_name == 'usuarios' %}active{% endif %}">Usuarios</a></li>
        <li><a href="{% url 'productos' %}" class="{% if request.resolver_match.url_name == 'productos' %}active{% endif %}">Productos</a></li>
        <li><a href="{% url 'inv_control' %}" class="{% if request.resolver_match.url_name == 'inv_control' %}active{% endif %}">Inventario</a></li>
        <li><a href="{% url 'factura-list' %}" class="{% if request.resolver_match.url_name == 'factura-list' or request.resolver_match.url_name == 'factura-crear' or request.resolver_match.url_name == 'factura-detalle' %}active{% endif %}">Facturación</a></li>
        <li><a href="{% url 'auditoria' %}" class="{% if request.resolver_match.url_name == 'auditoria' %}active{% endif %}">Auditoría</a></li>
        <li><a href="{% url 'configuracion' %}" class="{% if request.resolver_match.url_name == 'configuracion' %}active{% endif %}">Configuración</a></li>
      </ul>
    </nav>
    <div class="Cerrar-sesion">
<li> <a href="{% url 'logout' %}" class="btn-logout"
          onclick="return confirm('¿Estás seguro de que quieres cerrar sesión?')">Cerrar sesión</a></li>
    </div>
  </aside>

  <div class="main-container">
    {% block content %}
    {% endblock %}
  </div>

</body>

</html>
