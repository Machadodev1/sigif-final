<!DOCTYPE html>
{% extends 'base.html' %}
{% block content %}
<h1>Eliminar Producto</h1>
<p>¿Está seguro de eliminar el producto "{{ producto.nombre }}"?</p>
  <form method="post">
  {% csrf_token %}
  <button type="submit" class="btn-delete">Sí, eliminar</button>
  <a href="{% url 'listar_productos' %}" class="btn-nuevo" style="background:#e6edf2; color:var(--text-main); margin-left:8px;">Cancelar</a>
</form>
{% endblock %}
